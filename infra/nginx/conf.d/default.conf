server {
    listen 80;

    client_max_body_size 60M;

    # Spring 컨테이너가 재생성되어 내부 IP가 변경돼도 Docker DNS를 다시 조회한다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $spring_upstream spring;

    location ~* \.(php|asp|aspx|jsp|env|cgi|bak|log)$ {
        return 444;
    }

    location ~* /(wp-admin|phpmyadmin|config|setup) {
        return 444;
    }

    location /api/notification/subscribe {
        proxy_pass http://$spring_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 설정을 위한 필수 옵션
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;               # 서버 응답을 즉시 전달하도록 버퍼링 비활성화
        proxy_cache off;                   # SSE 응답이 캐싱되지 않도록 설정
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;          # 1시간 동안 연결 유지 (애플리케이션 타임아웃과 동기화)
    }

    location / {
        proxy_pass http://$spring_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 외부 프록시(Cloudflare, AWS ALB 등)가 HTTPS로 넘겨준 X-Forwarded-Proto 값을 그대로 유지
        set $my_scheme $scheme;
        if ($http_x_forwarded_proto != "") {
            set $my_scheme $http_x_forwarded_proto;
        }
        proxy_set_header X-Forwarded-Proto $my_scheme;
    }
}
