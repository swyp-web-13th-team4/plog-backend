server:
  forward-headers-strategy: framework

spring:
  config:
    activate:
      on-profile: dev
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  security:
    front:
      cors:
        allowed-origins: "https://plog-pi.vercel.app, https://localhost:3000, https://localhost:5173" # 프론트 CORS 허용 주소
      frontend-url:  https://plog-pi.vercel.app

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        hbm2ddl:
          auto: update
cookie:
  secure: true
  sameSite: None

logging:
  level:
    com.plog: debug
    org.springframework.web: debug
    org.springframework.web.servlet.mvc.method.annotation: debug