<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<!-- Sidebar Fragment -->
<aside th:fragment="sidebar(currentMenu)"
       class="fixed left-0 top-0 bottom-0 w-60 bg-sidebar-bg border-r border-gray-200 flex flex-col z-10">

  <!-- Logo / Service Name -->
  <div class="px-5 pt-6 pb-4">
    <div class="flex items-center gap-2">
      <span class="text-primary text-lg font-bold">서비스명</span>
      <span class="text-lg font-bold text-gray-800">Admin</span>
    </div>
    <p class="text-xs text-gray-400 mt-0.5">관리자 포털</p>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-3 overflow-y-auto">

    <!-- 콘텐츠 섹션 -->
    <div class="mb-4">
      <p class="px-3 py-2 text-[11px] font-semibold text-gray-400 uppercase tracking-wider">콘텐츠</p>

      <a href="/admin/notice"
         th:classappend="${currentMenu == 'notice'} ? 'bg-primary text-white' : 'text-gray-700 hover:bg-sidebar-hover'"
         class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
        <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
        공지사항
      </a>

      <a href="/admin/inquiry"
         th:classappend="${currentMenu == 'inquiry'} ? 'bg-primary text-white' : 'text-gray-700 hover:bg-sidebar-hover'"
         class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
        <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
        </svg>
        문의
      </a>

      <a href="/admin/report"
         th:classappend="${currentMenu == 'report'} ? 'bg-primary text-white' : 'text-gray-700 hover:bg-sidebar-hover'"
         class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
        <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
        </svg>
        신고
      </a>

      <a href="/admin/block"
         th:classappend="${currentMenu == 'block'} ? 'bg-primary text-white' : 'text-gray-700 hover:bg-sidebar-hover'"
         class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
        <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
        </svg>
        차단 목록
      </a>
    </div>

    <!-- 회원 섹션 -->
    <div class="mb-4">
      <p class="px-3 py-2 text-[11px] font-semibold text-gray-400 uppercase tracking-wider">회원</p>

      <a href="/admin/members"
         th:classappend="${currentMenu == 'members'} ? 'bg-primary text-white' : 'text-gray-700 hover:bg-sidebar-hover'"
         class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
        <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"/>
        </svg>
        회원 목록
      </a>

      <a href="/admin/statistics"
         th:classappend="${currentMenu == 'statistics'} ? 'bg-primary text-white' : 'text-gray-700 hover:bg-sidebar-hover'"
         class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
        <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        통계
      </a>
    </div>
  </nav>
</aside>
</body>
</html>
