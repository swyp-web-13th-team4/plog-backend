<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<!-- Header Fragment -->
<header th:fragment="header(pageTitle)"
        class="sticky top-0 z-10 bg-white border-b border-gray-200 px-8 h-16 flex items-center justify-between">

  <!-- 페이지 제목 -->
  <h1 class="text-lg font-bold text-gray-900" th:text="${pageTitle} ?: '관리'">페이지 제목</h1>

  <!-- 우측 아이콘 영역 -->
  <div class="flex items-center gap-4">
    <!-- 알림 벨 -->
    <button class="relative p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
      </svg>
    </button>

    <!-- 관리 버튼 -->
    <span class="inline-flex items-center px-3 py-1.5 bg-primary text-white text-sm font-medium rounded-lg">
      관리
    </span>
  </div>
</header>
</body>
</html>
