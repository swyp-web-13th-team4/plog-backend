<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>1:1 문의 관리</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div class="layout">
  <div th:replace="~{admin/fragments/common :: sidebar}"></div>
  <div class="main">
    <div th:replace="~{admin/fragments/common :: header('1:1 문의 관리')}"></div>

    <div class="grid-4">
      <div class="card stat-card">
        <div class="stat-label">전체 문의 💬</div>
        <div class="stat-value" id="statTotal">-</div>
      </div>
      <div class="card stat-card">
        <div class="stat-label">미답변 ⚠️</div>
        <div class="stat-value" id="statReceipt">-</div>
      </div>
      <div class="card stat-card">
        <div class="stat-label">답변 대기 📈</div>
        <div class="stat-value" id="statWaits">-</div>
      </div>
      <div class="card stat-card">
        <div class="stat-label">답변완료 ✅</div>
        <div class="stat-value" id="statFinish">-</div>
      </div>
    </div>

    <div class="card">
      <h3 style="font-size:15px; margin-bottom:8px;">1:1 문의 목록</h3>
      <table>
        <thead>
        <tr><th>제목</th><th>작성자</th><th>카테고리</th><th>작성일자</th><th>상태</th></tr>
        </thead>
        <tbody id="inquiryTableBody"><!-- 목록 --></tbody>
      </table>
    </div>

    <!-- 상세 + 답변 패널 (행 클릭 시 표시) -->
    <div class="card" id="detailPanel" style="display:none; margin-top:20px;">
      <div style="display:flex; justify-content:space-between;">
        <h3 id="detailTitle" style="font-size:15px;"></h3>
        <span class="tag" id="detailStatusTag"></span>
      </div>
      <p id="detailAuthor" style="font-size:12px; color:#9ca3af; margin-top:4px;"></p>
      <p id="detailContent" style="margin-top:12px; font-size:14px; line-height:1.6; white-space:pre-wrap;"></p>

      <div id="detailImages" style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;"></div>

      <hr style="margin:20px 0; border:none; border-top:1px solid #f3f4f6;">

      <label>카테고리</label>
      <select id="answerCategory">
        <option value="">카테고리 선택...</option>
        <option value="REFUND">환불 문의</option>
        <option value="SECESSION">회원/탈퇴 문의</option>
        <option value="ERROR">오류 문의</option>
        <option value="FEEDBACK">건의/제안</option>
        <option value="ETC">기타</option>
      </select>

      <label>답변 제목</label>
      <input type="text" id="answerTitle" placeholder="답변 제목을 입력하세요">

      <label>답변 내용</label>
      <textarea id="answerContent" placeholder="답변을 입력하세요"></textarea>

      <button class="btn-primary" onclick="submitAnswer()">답변 등록</button>
    </div>
  </div>
</div>

<script th:inline="javascript">
  let currentInquiryId = null;

  function categoryLabel(category) {
    const map = {
      REFUND: '환불 문의',
      SECESSION: '회원/탈퇴 문의',
      ERROR: '오류 문의',
      FEEDBACK: '건의/제안',
      ETC: '기타',
    };
    return map[category] ?? category ?? '-';
  }

  function statusTag(status) {
    if (!status) return 'tag-closed';
    const s = status.toString().toUpperCase();
    if (s.includes('WAIT') || s.includes('RECEIPT')) return 'tag-waiting';
    if (s.includes('FINISH') || s.includes('ANSWER') || s.includes('DONE')) return 'tag-answered';
    return 'tag-closed';
  }
  function statusLabel(status) {
    return status ?? '-';
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  async function loadStats() {
    const res = await fetch('/admin/api/inquiry/count');
    const json = await res.json();
    const d = json.data || {};
    document.getElementById('statTotal').innerText = d.totalCount ?? 0;
    document.getElementById('statReceipt').innerText = d.receipt ?? 0;
    document.getElementById('statWaits').innerText = d.waits ?? 0;
    document.getElementById('statFinish').innerText = d.finish ?? 0;
  }

  async function loadInquiries() {
    const res = await fetch('/admin/api/inquiry');
    const json = await res.json();
    const list = json.data || [];

    const tbody = document.getElementById('inquiryTableBody');
    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#9ca3af;">등록된 문의가 없습니다.</td></tr>`;
      return;
    }
    tbody.innerHTML = list.map(i => `
            <tr onclick="openDetail(${i.id})">
                <td>${i.title}</td>
                <td>${i.author}</td>
                <td>${categoryLabel(i.category)}</td>
                <td>${formatDate(i.localDateTime)}</td>
                <td><span class="tag ${statusTag(i.inquiryStatus)}">${statusLabel(i.inquiryStatus)}</span></td>
            </tr>`).join('');
  }

  async function openDetail(id) {
    currentInquiryId = id;
    const res = await fetch(`/admin/api/inquiry/${id}`);
    const json = await res.json();
    const d = json.data;

    document.getElementById('detailPanel').style.display = 'block';
    document.getElementById('detailTitle').innerText = d.title;
    document.getElementById('detailStatusTag').innerText = statusLabel(d.status);
    document.getElementById('detailStatusTag').className = 'tag ' + statusTag(d.status);
    document.getElementById('detailAuthor').innerText = `${d.author} · ${d.memberId}`;
    document.getElementById('detailContent').innerText = d.content;

    const imagesDiv = document.getElementById('detailImages');
    imagesDiv.innerHTML = (d.imageUrls || [])
    .map(url => `<img src="${url}" style="width:80px;height:80px;object-fit:cover;border-radius:6px;">`)
    .join('');

    document.getElementById('answerCategory').value = '';
    document.getElementById('answerTitle').value = '';
    document.getElementById('answerContent').value = '';

    document.getElementById('detailPanel').scrollIntoView({ behavior: 'smooth' });
  }

  async function submitAnswer() {
    if (!currentInquiryId) return;

    const category = document.getElementById('answerCategory').value;
    const answerTitle = document.getElementById('answerTitle').value.trim();
    const answerContent = document.getElementById('answerContent').value.trim();

    if (!category || !answerTitle || !answerContent) {
      alert('카테고리, 답변 제목, 내용을 모두 입력해주세요.');
      return;
    }

    const res = await fetch(`/admin/api/inquiry/${currentInquiryId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ category, answerTitle, answerContent })
    });

    if (res.ok) {
      loadInquiries();
      loadStats();
      openDetail(currentInquiryId);
    } else {
      alert('답변 등록에 실패했습니다.');
    }
  }

  loadStats();
  loadInquiries();
</script>
</body>
</html>
