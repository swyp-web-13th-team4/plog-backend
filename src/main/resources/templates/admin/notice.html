<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>공지사항 관리</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div class="layout">
  <div th:replace="~{admin/fragments/common :: sidebar}"></div>
  <div class="main">
    <div th:replace="~{admin/fragments/common :: header('공지사항 관리')}"></div>

    <div class="grid-2">
      <!-- 등록 폼 -->
      <div class="card">
        <h3 style="font-size:15px; margin-bottom:4px;">공지사항 등록</h3>

        <label>제목</label>
        <input type="text" id="noticeTitle" placeholder="공지 제목을 입력하세요">

        <div class="row-2">
          <div>
            <label>카테고리</label>
            <select id="noticeCategory">
              <option value="GENERAL">일반 공지</option>
              <option value="UPDATE">업데이트</option>
              <option value="MAINTENANCE">점검 안내</option>
              <option value="EVENT">이벤트</option>
            </select>
          </div>
          <div>
            <label>노출 상태</label>
            <select id="noticeStatus">
              <option value="ACTIVE">게시중</option>
              <option value="SCHEDULED">예약</option>
              <option value="CLOSED">종료</option>
            </select>
          </div>
        </div>

        <label>예약 게시 일시</label>
        <div class="row-2">
          <input type="date" id="noticeStartDate">
          <input type="text" id="noticeStartTime" placeholder="시:분">
        </div>

        <label>내용</label>
        <textarea id="noticeContent" maxlength="2000" oninput="updateCharCount()"></textarea>
        <div class="char-count"><span id="charCount">0</span> / 2000자</div>

        <div class="row-2">
          <div>
            <label>상단 고정</label>
            <select id="noticePin">
              <option value="false">고정 안함</option>
              <option value="true">상단 고정</option>
            </select>
          </div>
          <div>
            <label>대상</label>
            <select id="noticeTarget">
              <option value="ALL">전체</option>
              <option value="USER">일반 회원</option>
            </select>
          </div>
        </div>

        <button class="btn-primary" onclick="submitNotice()">📨 등록하기</button>
      </div>

      <!-- 등록된 목록 -->
      <div class="card">
        <h3 style="font-size:15px; margin-bottom:12px;">등록된 공지사항</h3>
        <div class="filters">
          <select><option>전체 카테고리</option></select>
          <select><option>전체 상태</option></select>
          <select><option>최신순</option></select>
        </div>

        <table>
          <thead>
          <tr><th>제목</th><th>카테고리</th><th>날짜</th><th>상태</th><th></th></tr>
          </thead>
          <tbody id="noticeTableBody">
          <!-- JS로 채워짐 -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script th:inline="javascript">
  function updateCharCount() {
    const content = document.getElementById('noticeContent').value;
    document.getElementById('charCount').innerText = content.length;
  }

  async function loadNotices() {
    const res = await fetch('/admin/api/notice');
    const json = await res.json();
    const list = json.data || [];
    const tbody = document.getElementById('noticeTableBody');
    tbody.innerHTML = list.map(n => `
            <tr onclick="location.href='/admin/notice/${n.id}'">
                <td>${n.pinned ? '<span class="tag tag-pin">고정</span> ' : ''}${n.title}</td>
                <td>${n.category}</td>
                <td>${n.createdDate}</td>
                <td><span class="tag ${statusTag(n.status)}">${statusLabel(n.status)}</span></td>
                <td onclick="event.stopPropagation()">
                    <button class="icon-btn" onclick="editNotice(${n.id})">✏️</button>
                    <button class="icon-btn" onclick="deleteNotice(${n.id})">🗑</button>
                </td>
            </tr>`).join('');
  }

  function statusTag(status) {
    return status === 'ACTIVE' ? 'tag-active' : 'tag-closed';
  }
  function statusLabel(status) {
    return status === 'ACTIVE' ? '게시중' : '종료';
  }

  async function submitNotice() {
    const body = {
      title: document.getElementById('noticeTitle').value,
      category: document.getElementById('noticeCategory').value,
      status: document.getElementById('noticeStatus').value,
      content: document.getElementById('noticeContent').value,
      pinned: document.getElementById('noticePin').value === 'true',
      target: document.getElementById('noticeTarget').value,
    };
    const res = await fetch('/admin/api/notice', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (res.ok) {
      document.getElementById('noticeTitle').value = '';
      document.getElementById('noticeContent').value = '';
      updateCharCount();
      loadNotices();
    }
  }

  async function deleteNotice(id) {
    if (!confirm('삭제하시겠습니까?')) return;
    await fetch(`/admin/api/notice/${id}`, { method: 'DELETE' });
    loadNotices();
  }

  function editNotice(id) {
    location.href = `/admin/notice/${id}/edit`;
  }

  loadNotices();
</script>
</body>
</html>
