<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>접근 권한 없음 - Plog Admin</title>
  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center">
    <!-- Icon -->
    <div class="mx-auto flex items-center justify-center w-16 h-16 rounded-full bg-red-100 mb-6">
      <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
      </svg>
    </div>
    
    <h2 class="text-2xl font-bold text-gray-900 mb-2">접근 권한이 없습니다</h2>
    <p class="text-gray-500 mb-8 text-sm">
      관리자 페이지에 접근할 수 있는 권한이 없습니다.<br>
      일반 서비스로 이동하여 이용해 주세요.
    </p>

    <a th:href="${@environment.getProperty('spring.security.front.frontend-url')}" 
       class="inline-flex items-center justify-center w-full px-4 py-2.5 bg-green-700 hover:bg-green-800 text-white font-medium rounded-lg transition-colors">
      서비스 홈으로 돌아가기
    </a>
  </div>
</body>
</html>
