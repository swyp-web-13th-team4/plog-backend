<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로컬 테스트용 관리자 가입</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center">
    
    <div class="mx-auto flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 mb-6">
      <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"/>
      </svg>
    </div>
    
    <h2 class="text-2xl font-bold text-gray-900 mb-2">테스트용 관리자 가입</h2>
    <p class="text-gray-500 mb-8 text-sm">
      카카오 로그인이 완료되었습니다.<br>
      테스트에 사용할 닉네임을 입력하시면 <strong class="text-gray-900">관리자(ADMIN)</strong> 권한으로 즉시 가입됩니다.
    </p>

    <form th:action="@{/testlogin/signup}" method="post" class="text-left">
      <div class="mb-6">
        <label for="nickname" class="block text-sm font-medium text-gray-700 mb-2">닉네임</label>
        <input type="text" id="nickname" name="nickname" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
               placeholder="예: 어드민테스트">
      </div>
      
      <button type="submit" 
              class="w-full px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors">
        관리자 계정으로 가입하기
      </button>
    </form>

  </div>
</body>
</html>
