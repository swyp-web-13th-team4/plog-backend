<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plog — 분석 기능 테스트</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #070b14;
      --surface: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.1);
      --text: #e8eaf6;
      --muted: #7986ab;
      --accent: #818cf8;
      --success: #4ade80;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 16px;
      position: relative;
      overflow-x: hidden;
    }

    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }

    .bg-orb-1 {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(74, 222, 128, 0.12), transparent 70%);
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
    }

    .bg-orb-2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15), transparent 70%);
      bottom: -100px;
      right: -100px;
      animation-delay: -4s;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateX(-50%) translateY(0);
      }
      50% {
        transform: translateX(-50%) translateY(-20px);
      }
    }

    .page-wrap {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      z-index: 10;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px 28px;
      backdrop-filter: blur(16px);
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .api-run-btn {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 14px;
      width: 100%;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
    }

    .api-run-btn:hover {
      background: rgba(99, 102, 241, 0.25);
      border-color: rgba(99, 102, 241, 0.5);
    }

    .api-result {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 16px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #a5b4fc;
      display: none;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 200px;
      overflow-y: auto;
    }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }

    .data-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .data-label {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .data-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }

    .work-type-card {
      display: flex;
      gap: 16px;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 12px;
    }

    .work-type-img {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      background: #000;
      object-fit: cover;
    }

    .ranking-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .ranking-rank {
      font-weight: 700;
      color: var(--accent);
      width: 24px;
    }

    .ranking-name {
      flex: 1;
      font-weight: 500;
    }

    .ranking-score {
      font-weight: 700;
      color: var(--success);
    }

    .footer-btns {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-outline {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(129, 140, 248, 0.06);
    }

    .null-message {
      color: var(--muted);
      font-size: 0.9rem;
      font-style: italic;
      padding: 16px;
      text-align: center;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <div class="page-wrap">
    
    <div class="card">
      <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 8px;">분석 기능 테스트</h2>
      <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 24px;">내 기록을 기반으로 한 분석 결과 API(/api/members/analytics)를 호출합니다.</p>

      <button type="button" class="api-run-btn" id="fetch-btn" onclick="fetchAnalytics()">분석 정보 불러오기</button>
      <div class="api-result" id="result-log"></div>
    </div>

    <!-- 1. 기본 통계 -->
    <div class="card" id="section-stats" style="display: none;">
      <div class="card-title">나의 기록 요약</div>
      <div class="data-grid">
        <div class="data-item">
          <div class="data-label">총 기록 횟수</div>
          <div class="data-value" id="val-post-count">-</div>
        </div>
        <div class="data-item">
          <div class="data-label">총 작업 시간</div>
          <div class="data-value" id="val-study-time">-</div>
        </div>
      </div>
    </div>

    <!-- 2. 작업 유형 카드 -->
    <div class="card" id="section-card" style="display: none;">
      <div class="card-title">나의 작업 유형 카드</div>
      <div id="card-content">
        <!-- 렌더링 영역 -->
      </div>
    </div>

    <!-- 3. 집중 환경 -->
    <div class="card" id="section-env" style="display: none;">
      <div class="card-title">나에게 맞는 집중 환경 조건</div>
      <div id="env-content">
        <!-- 렌더링 영역 -->
      </div>
    </div>

    <!-- 4. 공간별 순위 -->
    <div class="card" id="section-ranking" style="display: none;">
      <div class="card-title">공간별 순위 (Top 3)</div>
      <div id="ranking-content" class="ranking-list">
        <!-- 렌더링 영역 -->
      </div>
    </div>

    <div class="footer-btns">
      <a class="btn-outline" href="success.html">← 로그인 성공 페이지</a>
      <a class="btn-outline" href="mypage.html">마이페이지 →</a>
    </div>

  </div>

  <script>
    const API_BASE = 'http://localhost:8080';

    async function fetchAnalytics() {
      const resultEl = document.getElementById('result-log');
      const fetchBtn = document.getElementById('fetch-btn');
      
      resultEl.style.display = 'block';
      resultEl.style.color = '#a5b4fc';
      resultEl.textContent = '분석 정보 불러오는 중...';
      fetchBtn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/api/members/analytics`, {
          method: 'GET',
          credentials: 'include'
        });

        const data = await res.json();
        
        if (res.ok && data.code === 200) {
          resultEl.style.color = '#86efac';
          resultEl.textContent = `불러오기 성공!\n${JSON.stringify(data, null, 2)}`;
          renderAnalytics(data.data);
        } else {
          resultEl.style.color = '#fca5a5';
          resultEl.textContent = `오류 발생: HTTP ${res.status}\n${JSON.stringify(data, null, 2)}`;
        }
      } catch (err) {
        resultEl.style.color = '#fca5a5';
        resultEl.textContent = `연결 실패: ${err.message}`;
      } finally {
        fetchBtn.disabled = false;
      }
    }

    function renderAnalytics(data) {
      document.getElementById('section-stats').style.display = 'block';
      document.getElementById('section-card').style.display = 'block';
      document.getElementById('section-env').style.display = 'block';
      document.getElementById('section-ranking').style.display = 'block';

      // 1. 기본 통계
      document.getElementById('val-post-count').textContent = `${data.totalPostCount || 0}회`;
      document.getElementById('val-study-time').textContent = formatTime(data.totalStudyTime || 0);

      // 2. 작업 유형 카드
      const cardContent = document.getElementById('card-content');
      if (data.workTypeCard) {
        cardContent.innerHTML = `
          <div class="work-type-card">
            <img src="${data.workTypeCard.imageUrl || ''}" alt="카드 이미지" class="work-type-img" onerror="this.src='https://via.placeholder.80'">
            <div>
              <div style="font-size: 1.1rem; font-weight: 700; color: var(--accent); margin-bottom: 4px;">
                ${data.workTypeCard.name}
              </div>
              <div style="font-size: 0.9rem; color: var(--text);">
                ${data.workTypeCard.description}
              </div>
            </div>
          </div>
        `;
      } else {
        cardContent.innerHTML = `<div class="null-message">게시글이 5개 미만이어서 작업 유형 카드가 아직 발급되지 않았습니다.</div>`;
      }

      // 3. 집중 환경
      const envContent = document.getElementById('env-content');
      if (data.focusEnvironment) {
        const env = data.focusEnvironment;
        envContent.innerHTML = `
          <div class="data-grid">
            <div class="data-item">
              <div class="data-label">최고 집중 시간대</div>
              <div class="data-value">${env.bestTimePeriod || '-'}</div>
              <div style="font-size: 0.8rem; color: var(--success); margin-top: 4px;">평균 집중도: ${env.bestTimePeriodAvgFocus?.toFixed(1) || '-'}</div>
            </div>
            <div class="data-item">
              <div class="data-label">최고 집중 태그</div>
              <div class="data-value">${env.bestPlaceTag || '-'}</div>
            </div>
            <div class="data-item" style="grid-column: span 2;">
              <div class="data-label">집중 방해 요소 태그 (편차가 큰 태그)</div>
              <div class="data-value" style="color: #fca5a5;">${env.worstPlaceTag || '-'}</div>
            </div>
          </div>
        `;
      } else {
        envContent.innerHTML = `<div class="null-message">게시글이 15개 미만이어서 집중 환경 분석 결과가 아직 없습니다.</div>`;
      }

      // 4. 공간별 순위
      const rankingContent = document.getElementById('ranking-content');
      if (data.spaceRankings && data.spaceRankings.length > 0) {
        let html = '';
        data.spaceRankings.forEach((item, index) => {
          html += `
            <div class="ranking-item">
              <div class="ranking-rank">${index + 1}</div>
              <div class="ranking-name">${item.placeCategoryName}</div>
              <div class="ranking-score">평균 ${item.averageFocus?.toFixed(1) || '-'}</div>
            </div>
          `;
        });
        rankingContent.innerHTML = html;
      } else {
        rankingContent.innerHTML = `<div class="null-message">게시글이 15개 미만이어서 공간별 순위 결과가 아직 없습니다.</div>`;
      }
    }

    function formatTime(minutes) {
      if (minutes < 60) return `${minutes}분`;
      const hours = Math.floor(minutes / 60);
      const mins = minutes % 60;
      return mins > 0 ? `${hours}시간 ${mins}분` : `${hours}시간`;
    }
  </script>
</body>
</html>
