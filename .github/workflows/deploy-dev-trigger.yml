name: Plog Dev Deploy Trigger

on:
  workflow_dispatch:

jobs:
  deploy:
    environment: dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Docker Buildx 세팅 (GHA 캐시 백엔드 활성화용)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 컴파일 캐시 옵션 활성화 및 clean 제거
      - name: Build with Gradle
        run: ./gradlew build -x test --build-cache

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 캐시 백엔드(gha)를 활용한 이미지 빌드 및 푸시 통합
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy promtail-config to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "infra/promtail/promtail-config.dev.yml"
          target: ${{ secrets.DEPLOY_DIR }}/infra/promtail
          strip_components: 2

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.dev.yml"
          target: ${{ secrets.DEPLOY_DIR }}

      # [중요 수정] 기존 Trigger 파일에서 누락되었던 PROJECT_ID와 PLOG_STORAGE_BUCKET 동기화 완료
      - name: Create .env file
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_DIR }}
            cat > .env.dev << EOF
            MYSQL_ROOT_PASSWORD=$(gcloud secrets versions access latest --secret=dev-MYSQL_ROOT_PASSWORD)
            MYSQL_DATABASE=$(gcloud secrets versions access latest --secret=dev-MYSQL_DATABASE)
            MYSQL_USER=$(gcloud secrets versions access latest --secret=dev-MYSQL_USER)
            MYSQL_PASSWORD=$(gcloud secrets versions access latest --secret=dev-MYSQL_PASSWORD)
            DOCKERHUB_USERNAME=$(gcloud secrets versions access latest --secret=dev-DOCKERHUB_USERNAME)
            DOCKERHUB_REPOSITORY=$(gcloud secrets versions access latest --secret=dev-DOCKERHUB_REPOSITORY)
            DEV_DB_URL=$(gcloud secrets versions access latest --secret=dev-DB_URL)
            DEV_DB_USERNAME=$(gcloud secrets versions access latest --secret=dev-DB_USERNAME)
            DEV_DB_PASSWORD=$(gcloud secrets versions access latest --secret=dev-DB_PASSWORD)
            JWT_SECRET_KEY=$(gcloud secrets versions access latest --secret=dev-JWT_SECRET_KEY)
            KAKAO_CLIENT_ID=$(gcloud secrets versions access latest --secret=dev-KAKAO_CLIENT_ID)
            KAKAO_CLIENT_SECRET=$(gcloud secrets versions access latest --secret=dev-KAKAO_CLIENT_SECRET)
            PROJECT_ID=$(gcloud secrets versions access latest --secret=dev-PROJECT_ID)
            PLOG_STORAGE_BUCKET=$(gcloud secrets versions access latest --secret=dev-PLOG_STORAGE_BUCKET)
            EOF

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_DIR }}
            docker compose -f docker-compose.dev.yml --env-file .env.dev pull
            docker compose -f docker-compose.dev.yml --env-file .env.dev up -d